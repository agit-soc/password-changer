
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        p {
            color: #777;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 6px;
            background: #830d3a;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #650a2d;
        }

        .notice {
            margin-top: 20px;
            padding: 12px;
            background: #fff4e5;
            color: #875b16;
            font-size: 12px;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Change Password</h2>
        <p>Silakan masukkan informasi untuk perubahan password anda.</p>

        <form id="passwordForm">
            <label>Password Lama</label>
            <input type="password"
                   placeholder="Masukkan password lama"
                   required autocomplete="off">

            <label>Password Baru</label>
            <input type="password"
                   placeholder="Masukkan password baru"
                   required autocomplete="off">

            <label>Konfirmasi Password Baru</label>
            <input type="password"
                   placeholder="Konfirmasi password baru"
                   required autocomplete="off">

            <button type="submit">Change Password</button>
        </form>

    </div>

    <script>
        document.getElementById("passwordForm")
            .addEventListener("submit", function(e) {
                e.preventDefault();

                // Tidak membaca, mengirim, atau menyimpan password.
                alert("Terima kasih.");
                this.reset();
            });
    </script>
</body>
</html>
